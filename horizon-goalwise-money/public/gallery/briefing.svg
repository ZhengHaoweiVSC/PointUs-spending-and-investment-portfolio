<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="Inter, Arial, sans-serif">
<rect width="1200" height="750" fill="#FAFAF7"/><rect x="0" y="0" width="1200" height="64" fill="#111111"/>
<rect x="32" y="22" width="20" height="20" fill="#0B6E4F"/><text x="64" y="40" fill="#FAFAF7" font-size="22" font-weight="700">PointUs</text>
<text x="1168" y="40" fill="#FAFAF7" font-size="16" text-anchor="end">Briefing</text><text x="40" y="130" font-size="34" font-weight="700" fill="#111111" text-anchor="start">The news, in your numbers</text><rect x="40" y="160" width="1120" height="160" fill="#FAFAF7" stroke="#111111" stroke-width="2"/><rect x="64" y="180" width="102" height="30" fill="#111111"/><text x="76" y="202" font-size="15" font-weight="700" fill="#FAFAF7" text-anchor="start">ENERGY</text><text x="64" y="250" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Energy price cap to rise 10% in January</text><text x="64" y="290" font-size="19" font-weight="400" fill="#0B6E4F" text-anchor="start">What this means for you: Your £85 energy bill rises by about £9 a month.</text><rect x="40" y="340" width="1120" height="160" fill="#FAFAF7" stroke="#111111" stroke-width="2"/><rect x="64" y="360" width="89" height="30" fill="#111111"/><text x="76" y="382" font-size="15" font-weight="700" fill="#FAFAF7" text-anchor="start">RATES</text><text x="64" y="430" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Bank of England holds rates</text><text x="64" y="470" font-size="19" font-weight="400" fill="#0B6E4F" text-anchor="start">What this means for you: A 0.25% change on your £120 savings is about £0.30 a year.</text><rect x="40" y="520" width="1120" height="160" fill="#FAFAF7" stroke="#111111" stroke-width="2"/><rect x="64" y="540" width="115" height="30" fill="#111111"/><text x="76" y="562" font-size="15" font-weight="700" fill="#FAFAF7" text-anchor="start">HOUSING</text><text x="64" y="610" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Average UK rents up 7%</text><text x="64" y="650" font-size="19" font-weight="400" fill="#0B6E4F" text-anchor="start">What this means for you: A 7% rise on your £750 rent would be £53 a month.</text></svg>